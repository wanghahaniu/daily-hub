<!DOCTYPE html>
<!-- 个人日报工作台 · 阿成 | 六大日报索引，点击标题直接看日报 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的日报工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f4f6f9;--card:#fff;--line:#e6eaf0;--txt:#1a2233;--sub:#6b7688;--faint:#9aa4b4;
--brand:#1f5fbf;--brand-bg:#eaf1fd;--up:#d93025;--down:#0a9c5b;
--sh:0 1px 3px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.05);
--r:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased;
padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* 顶栏 */
header{background:linear-gradient(135deg,#1f5fbf,#3d82e0);color:#fff;padding:22px 0 20px}
header h1{font-size:21px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.3px}
header .sub{font-size:13px;opacity:.9;margin-top:7px}
.stat-row{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.stat b{font-size:20px;font-weight:600;display:block;line-height:1.2}
.stat span{font-size:11.5px;opacity:.85}

/* 搜索 */
.searchbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 10px;
border-bottom:1px solid var(--line);margin-bottom:14px}
.search-box{position:relative}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
#q{width:100%;height:46px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:11px;
background:var(--card);font-size:16px;color:var(--txt);outline:none;transition:.18s}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,191,.1)}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
border:none;background:none;cursor:pointer;color:var(--faint);display:none;align-items:center;
justify-content:center;border-radius:50%}
.clr.on{display:flex}

/* 分类 Tab */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 15px;border:1px solid var(--line);background:var(--card);
border-radius:20px;font-size:13.5px;color:var(--sub);cursor:pointer;white-space:nowrap;
transition:.18s;display:flex;align-items:center;gap:6px;min-height:38px}
.tab:hover{border-color:var(--brand);color:var(--brand)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.tab .n{font-size:11px;opacity:.75}

/* 置顶：今日更新 */
.pin{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:15px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.pin-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px}
.pin-h svg{color:var(--brand)}
.pin-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pin-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
border-radius:11px;text-decoration:none;color:inherit;background:#fbfcfe;transition:.18s}
.pin-item:hover{border-color:var(--brand);background:var(--brand-bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pin-t{font-size:14px;font-weight:500}
.pin-d{font-size:11.5px;color:var(--faint);margin-left:auto;white-space:nowrap}

/* 分类卡 */
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:15px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.cat-n{font-size:15.5px;font-weight:600}
.cat-i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.cat-m{font-size:11.5px;color:var(--faint);margin-left:auto}
.items{display:grid;gap:9px}
/* 日期小标题：把同类日报按日期序列串起来 */
.dateblock{margin-bottom:4px}
.dateblock:last-child{margin-bottom:0}
.date-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);
font-weight:500;padding:10px 0 8px;position:sticky;top:108px;background:var(--card);z-index:5}
.date-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.date-n{font-size:11.5px;color:var(--faint);margin-left:auto;font-weight:400}
.it{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);
border-radius:11px;text-decoration:none;color:inherit;transition:.18s;background:#fff}
.it:hover{border-color:var(--brand);background:var(--brand-bg);transform:translateX(2px)}
.it-main{flex:1;min-width:0}
.it-t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it-s{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.chip{font-size:11px;padding:1.5px 7px;border-radius:5px;background:#eef1f6;color:var(--sub);white-space:nowrap}
.tens{font-size:11.5px;padding:1.5px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.it-d{font-size:12px;color:var(--faint);white-space:nowrap;flex:0 0 auto;text-align:right}
.it-d b{display:block;font-size:13.5px;color:var(--txt);font-weight:500}
.arrow{color:var(--faint);flex:0 0 auto}

.empty{text-align:center;padding:56px 20px;color:var(--faint)}
.empty svg{opacity:.4;margin-bottom:12px}
.empty p{font-size:14px}
footer{text-align:center;padding:26px 16px 32px;font-size:11.5px;color:var(--faint);line-height:1.9}
@media(max-width:768px){
 header h1{font-size:19px}
 .stat-row{gap:18px}
 .stat b{font-size:18px}
 .pin-list{grid-template-columns:1fr}
 .it:hover{transform:none}
 .cat-h{gap:8px}
 .cat-m{margin-left:0;width:100%}
}
@media(max-width:380px){
 .wrap{padding:0 12px}
 .it-s{-webkit-line-clamp:1;line-clamp:1}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <h1>
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
   我的日报工作台
  </h1>
  <div class="sub">六大日报 · 定时自动生成 · 点击标题查看全文</div>
  <div class="stat-row" id="stats"></div>
 </div>
</header>

<div class="wrap">
 <div class="searchbar">
  <div class="search-box">
   <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
   <input id="q" type="search" placeholder="搜索日报标题、日期或内容摘要…" autocomplete="off">
   <button class="clr" id="clr" aria-label="清空">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
   </button>
  </div>
  <div class="tabs" id="tabs"></div>
 </div>
 <div id="pinWrap"></div>
 <div id="list"></div>
</div>

<footer>
 <div id="footInfo"></div>
 <div>页面与日报文件均托管于 GitHub Pages · 数据每日由定时任务自动更新</div>
</footer>

<script>
/* ============ 数据 ============ */
var DATA = null, ACTIVE = "all", KW = "", TENSION = {};

function loadManifest(cb){
  fetch("manifest.json?t=" + Date.now())
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ DATA = d; cb(); })
    .catch(function(e){ renderError(e.message); });
}

/* ============ 计算层 ============ */
function allItems(){
  if(!DATA) return [];
  return DATA.items.slice();
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function latestDate(){
  var it = allItems(); if(!it.length) return "";
  return it[0].date;
}
function match(item){
  if(ACTIVE !== "all" && item.key !== ACTIVE) return false;
  if(!KW) return true;
  var k = KW;
  return (item.title + " " + item.cat + " " + item.date + " " + (item.pageTitle||"") + " " + (item.summary||"")).toLowerCase().indexOf(k) >= 0;
}
function tensionColor(v){
  if(v==null) return {bg:"#eef1f6", fg:"#6b7688"};
  if(v>=90) return {bg:"#fdecea", fg:"#c5221f"};
  if(v>=70) return {bg:"#fff4e5", fg:"#d97528"};
  return {bg:"#e8f5ec", fg:"#0a9c5b"};
}
function catColor(key){
  /* 每类一个固定色相，颜色即身份，涨跌不占用色相 */
  return ({
    "us-iran":"#c5221f","oil":"#d97528","copper":"#b8761f","futures":"#1f5fbf",
    "zsxq":"#7b3fb5","zsxq-sum":"#0a9c5b","tech-geo":"#0e7c9c","cross":"#8a5cf6","macro-geo":"#4a5568"
  })[key] || "#6b7688";
}

/* ============ 渲染层（互不调用，由 refreshAll 统一调度） ============ */
function renderStats(){
  var items = allItems();
  var el = document.getElementById("stats");
  var cats = DATA.sources.length;
  var bytes = items.reduce(function(a,b){return a + (b.sizeKB||0);},0);
  el.innerHTML =
     '<div class="stat"><b>'+items.length+'</b><span>收录日报</span></div>' +
     '<div class="stat"><b>'+cats+'</b><span>日报类别</span></div>' +
     '<div class="stat"><b>'+latestDate()+'</b><span>最新日期</span></div>' +
     '<div class="stat"><b>'+(bytes/1024).toFixed(1)+' MB</b><span>总内容量</span></div>';
}
function renderTabs(){
  var el = document.getElementById("tabs");
  var items = allItems();
  var cnt = {all: items.length};
  DATA.sources.forEach(function(s){
    cnt[s.key] = items.filter(function(i){return i.key===s.key;}).length;
  });
  var h = '<button class="tab'+(ACTIVE==="all"?" on":"")+'" data-k="all">全部 <span class="n">'+cnt.all+'</span></button>';
  DATA.sources.forEach(function(s){
    h += '<button class="tab'+(ACTIVE===s.key?" on":"")+'" data-k="'+s.key+'" style="--tc:'+catColor(s.key)+'">'+
         '<span style="width:7px;height:7px;border-radius:50%;background:'+
         (ACTIVE===s.key?"#fff":catColor(s.key))+';display:inline-block"></span>'+
         s.cat+' <span class="n">'+cnt[s.key]+'</span></button>';
  });
  el.innerHTML = h;
  Array.prototype.forEach.call(el.querySelectorAll(".tab"), function(b){
    b.onclick = function(){ ACTIVE = b.dataset.k; refreshAll(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}
function renderPin(){
  var wrap = document.getElementById("pinWrap");
  var items = allItems().filter(match);
  if(ACTIVE !== "all" || KW){ wrap.innerHTML = ""; return; }
  var today = todayStr();
  var pin = items.filter(function(i){ return i.date >= today; });
  if(pin.length > 6) pin = pin.slice(0,6);
  if(!pin.length){ wrap.innerHTML=""; return; }
  var h = '<div class="pin"><div class="pin-h">'+
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>'+
    '最新更新 <span style="font-weight:400;color:var(--faint);font-size:12.5px">点击卡片直接看日报</span></div><div class="pin-list">';
  pin.forEach(function(i){
    var c = catColor(i.key);
    var tens = (i.key==="us-iran" && i.tension!=null)
      ? ' <span class="tens" style="background:'+tensionColor(i.tension).bg+';color:'+tensionColor(i.tension).fg+'">紧张度 '+i.tension+'</span>' : "";
    h += '<a class="pin-item" href="'+i.url+'">'+
         '<span class="dot" style="background:'+c+'"></span>'+
         '<span class="pin-t">'+esc(i.title)+tens+'</span>'+
         '<span class="pin-d">'+i.date.slice(5)+'</span></a>';
  });
  h += '</div></div>';
  wrap.innerHTML = h;
}
function renderList(){
  var el = document.getElementById("list");
  var items = allItems().filter(match);
  if(!items.length){
    el.innerHTML = '<div class="empty">'+
      '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
      '<p>没有匹配的日报</p><p style="font-size:12.5px;margin-top:6px">换个关键词，或点上方「全部」查看所有日报</p></div>';
    return;
  }

  var h = "";
  if(ACTIVE === "all"){
    /* 全部：按日报类别分块，每类内部按日期倒序排列 */
    DATA.sources.forEach(function(s){
      var rows = items.filter(function(i){ return i.key === s.key; });
      if(!rows.length) return;
      h += catBlock(s, rows);
    });
  } else {
    /* 单一分类：只按日期序列倒序 */
    var src = null;
    DATA.sources.forEach(function(s){ if(s.key === ACTIVE) src = s; });
    h += catBlock(src, items);
  }
  el.innerHTML = h;
}

/* 构造一个分类区块：标题带篇数与时间跨度，内部按日期倒序列出 */
function catBlock(src, rows){
  var c = catColor(src.key);
  var byDate = {}, order = [];
  rows.forEach(function(i){
    if(!byDate[i.date]){ byDate[i.date] = []; order.push(i.date); }
    byDate[i.date].push(i);
  });
  order.sort().reverse();

  var inner = order.map(function(d){
    var badges = byDate[d].map(function(i){
      var tc = catColor(i.key);
      var tens = (i.key==="us-iran" && i.tension!=null)
        ? '<span class="tens" style="background:'+tensionColor(i.tension).bg+';color:'+tensionColor(i.tension).fg+'">紧张度 '+i.tension+'</span>' : "";
      return '<a class="it" href="'+i.url+'">'+
        '<span class="it-main">'+
          '<span class="it-t">'+esc(i.title)+tens+
            '<span class="chip">'+esc(i.cat)+'</span>'+
            '<span class="chip">'+d+'</span>'+
          '</span>'+
          '<span class="it-s">'+esc(i.summary || "（无摘要）")+'</span>'+
        '</span>'+
        '<span class="it-d">'+(i.sizeKB||0)+' KB</span>'+
        '<svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'+
      '</a>';
    }).join("");
    return '<div class="dateblock">'+
      '<div class="date-h"><span class="date-dot" style="background:'+c+'"></span>'+d+
      '<span class="date-n">'+byDate[d].length+' 篇</span></div>'+
      '<div class="items">'+badges+'</div></div>';
  }).join("");

  return '<div class="cat"><div class="cat-h">'+
    '<span class="cat-i" style="background:'+c+'1a;color:'+c+'">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+
    '</span>'+
    '<span class="cat-n">'+esc(src.cat)+'</span>'+
    '<span class="cat-m">'+src.count+' 篇 · '+src.earliest+' 至 '+src.latest+'</span>'+
  '</div>' + inner + '</div>';
}
function renderFoot(){
  var items = allItems();
  document.getElementById("footInfo").textContent =
    "共 " + items.length + " 篇日报 · " + DATA.sources.length + " 个分类 · 覆盖 " +
    DATA.sources.map(function(s){return s.earliest;}).sort()[0] + " 至 " + latestDate();
}
function renderError(msg){
  document.getElementById("list").innerHTML =
    '<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'+
    '<p>日报索引加载失败</p><p style="font-size:12.5px;margin-top:6px">'+
    (msg?('原因：'+msg):'')+'　请检查网络后刷新页面</p></div>';
}

/* 统一刷新入口：所有渲染函数由它单向调度，彼此不互调 */
function refreshAll(){
  renderStats();
  renderTabs();
  renderPin();
  renderList();
  renderFoot();
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============ 事件绑定 ============ */
function initEvents(){
  var q = document.getElementById("q"), clr = document.getElementById("clr");
  var timer = null;
  q.oninput = function(){
    clr.classList.toggle("on", q.value.length>0);
    clearTimeout(timer);
    timer = setTimeout(function(){
      KW = q.value.trim().toLowerCase();
      renderPin(); renderList();
    }, 180);
  };
  clr.onclick = function(){
    q.value=""; KW=""; clr.classList.remove("on");
    renderPin(); renderList(); q.focus();
  };
}

/* ============ 初始化 ============ */
function init(){
  initEvents();
  loadManifest(refreshAll);
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>

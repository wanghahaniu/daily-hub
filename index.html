<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日报工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f2f4f8;--card:#fff;--line:#e5e9f0;--txt:#151c2c;--sub:#68738a;--faint:#98a2b3;
--brand:#1f5fbf;--brand-bg:#eaf1fd;--ok:#0a9c5b;--ok-bg:#e8f5ec;--warn:#d97528;--warn-bg:#fff4e5;
--sh:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);
--r:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased;
padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
a{color:inherit}

/* ---------- 顶栏 ---------- */
header{background:linear-gradient(140deg,#1b4fa8,#3d82e0 55%,#4f95ea);color:#fff;padding:24px 0 26px}
header h1{font-size:22px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.3px}
header .sub{font-size:13.5px;opacity:.9;margin-top:7px}
.stat-row{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stat b{font-size:21px;font-weight:600;display:block;line-height:1.2}
.stat span{font-size:11.5px;opacity:.85}

/* ---------- 搜索 ---------- */
.searchbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:14px 0 0;
border-bottom:1px solid var(--line);margin-bottom:20px}
.search-box{position:relative;padding-bottom:12px}
.search-box svg{position:absolute;left:14px;top:15px;color:var(--faint)}
#q{width:100%;height:46px;padding:0 46px 0 41px;border:1px solid var(--line);border-radius:12px;
background:var(--card);font-size:16px;color:var(--txt);outline:none;transition:.18s;
box-shadow:0 1px 2px rgba(20,30,50,.04)}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,191,.12)}
.clr{position:absolute;right:6px;top:8px;width:32px;height:32px;border:none;background:none;
cursor:pointer;color:var(--faint);display:none;align-items:center;justify-content:center;border-radius:50%}
.clr.on{display:flex}

/* ---------- 区块标题 ---------- */
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-h h2{font-size:16.5px;font-weight:600;letter-spacing:.2px}
.sec-h span{font-size:12.5px;color:var(--faint)}
.sec-h .link{margin-left:auto;font-size:12.5px;color:var(--brand);cursor:pointer;text-decoration:none}

/* ---------- 九宫格 ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;
cursor:pointer;text-decoration:none;display:flex;flex-direction:column;position:relative;overflow:hidden;
transition:.18s;box-shadow:var(--sh);min-height:118px}
.cell:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.cell:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(20,30,50,.07),0 14px 34px rgba(20,30,50,.10);
border-color:var(--tc)}
.cell:active{transform:translateY(0)}
.cell-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;line-height:1.3}
.cell-t .ic{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:0 0 auto}

/* 状态标签：今日已更新 / 今日未更新 */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
padding:2.5px 8px;border-radius:20px;margin-top:9px;align-self:flex-start;line-height:1.5}
.st i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.no{background:#eef1f6;color:var(--faint)}
.st .t{font-variant-numeric:tabular-nums;font-weight:600}
.cell-m{font-size:12px;color:var(--sub);margin-top:auto;padding-top:11px;
display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cell-m b{font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
.cell-m .sep{color:var(--faint)}

/* ---------- 今日已更新：卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:14px 16px;text-decoration:none;display:flex;align-items:flex-start;gap:13px;
transition:.18s;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.card:hover{border-color:var(--brand);background:var(--brand-bg);transform:translateX(2px)}
.card-bar{width:3.5px;border-radius:3px;background:var(--tc);flex:0 0 auto;align-self:stretch;min-height:38px}
.card-m{flex:1;min-width:0}
.card-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.card-s{font-size:12.5px;color:var(--sub);margin-top:5px;overflow:hidden;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.card-f{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:1.5px 7px;border-radius:5px;background:#eef1f6;color:var(--sub);white-space:nowrap}
.chip.tc{background:color-mix(in srgb,var(--tc) 12%,#fff);color:var(--tc)}
.tens{font-size:11.5px;padding:1.5px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.card-r{flex:0 0 auto;text-align:right;color:var(--faint);font-size:11.5px;padding-top:2px}
.card-r b{display:block;font-size:13px;color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.card-r .go{margin-top:6px;color:var(--faint)}
.card:hover .go{color:var(--brand)}

/* ---------- 分类库（点格子进入） ---------- */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.crumb button{background:var(--card);border:1px solid var(--line);border-radius:20px;
padding:7px 14px;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.18s;
display:inline-flex;align-items:center;gap:6px;min-height:36px}
.crumb button:hover{border-color:var(--brand);color:var(--brand)}
.crumb .cur{font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:0 4px}
.crumb .cur i{width:9px;height:9px;border-radius:50%;background:var(--tc)}

.dateblock{margin-bottom:6px}
.date-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:600;
padding:14px 0 9px}
.date-h .n{font-size:11.5px;color:var(--faint);margin-left:auto;font-weight:400}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tc);flex:0 0 auto}
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
border-radius:12px;text-decoration:none;transition:.18s;background:var(--card);box-shadow:0 1px 2px rgba(20,30,50,.04)}
.it+.it{margin-top:8px}
.it:hover{border-color:var(--brand);background:var(--brand-bg);transform:translateX(2px)}
.it-m{flex:1;min-width:0}
.it-t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it-s{font-size:12.5px;color:var(--sub);margin-top:4px;overflow:hidden;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.it-d{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;text-align:right;
font-variant-numeric:tabular-nums}
.it-d b{display:block;font-size:13.5px;color:var(--txt);font-weight:500}
.arrow{color:var(--faint);flex:0 0 auto}

.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty svg{opacity:.4;margin-bottom:12px}
.empty p{font-size:14px}
.empty p.sm{font-size:12.5px;margin-top:6px}

.localwarn{background:#fff4e5;border:1px solid #f5c26b;border-radius:var(--r);
padding:14px 16px;margin-bottom:18px;display:none}
.localwarn.on{display:block}
.lw-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#8a5a00;margin-bottom:8px}
.lw-b{font-size:13px;color:#8a5a00;line-height:1.75}
.lw-url{display:inline-block;margin-top:8px;padding:8px 13px;background:#fff;border:1px solid #f0c27a;
border-radius:8px;font-size:13px;color:#8a5a00;text-decoration:none;font-weight:600;
word-break:break-all;min-height:44px;line-height:1.6}
footer{text-align:center;padding:26px 16px 34px;font-size:11.5px;color:var(--faint);line-height:1.9}

/* ---------- 响应式 ---------- */
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){
 header h1{font-size:20px}
 .stat-row{gap:18px}
 .stat b{font-size:19px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .cell{min-height:112px;padding:13px 13px 12px}
 .cell-t{font-size:14px}
 .it:hover,.card:hover{transform:none}
}
@media(max-width:380px){
 .wrap{padding:0 12px}
 .grid{gap:9px}
 .cell{padding:11px 11px 10px}
 .cell-t{font-size:13.5px}
 .it-s,.card-s{-webkit-line-clamp:2;line-clamp:2}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <h1>
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
   日报工作台
  </h1>
  <div class="sub">九大门类 · 定时自动更新 · 点击格子进入该门类日报库</div>
  <div class="stat-row" id="stats"></div>
 </div>
</header>

<div class="wrap">
 <div class="searchbar">
  <div class="search-box">
   <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
   <input id="q" type="search" placeholder="搜索日报标题、日期或内容摘要…" autocomplete="off">
   <button class="clr" id="clr" aria-label="清空">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
   </button>
  </div>
 </div>

 <div class="localwarn" id="localWarn">
  <div class="lw-h">
   <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
   当前是本地预览地址，点日报会打不开
  </div>
  <div class="lw-b">页面本身加载正常，但日报文件没有跟着这个预览一起提供。请用正式地址打开（手机、电脑都可以）：</div>
  <a class="lw-url" href="https://wanghahaniu.github.io/daily-hub/" target="_blank">https://wanghahaniu.github.io/daily-hub/</a>
 </div>

 <div id="view"></div>
</div>

<footer>
 <div id="footInfo"></div>
 <div>页面与日报文件均托管于 GitHub Pages · 数据每日由定时任务自动更新</div>
</footer>

<script>
/* ================= 数据 ================= */
var DATA = null, ACTIVE = null, KW = "";

function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function allItems(){ return DATA ? DATA.items.slice() : []; }

function loadManifest(cb){
  fetch("manifest.json?t=" + Date.now())
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ DATA = d; cb(); })
    .catch(function(e){ renderError(e.message); });
}

/* ================= 计算层 ================= */
function catColor(key){
  /* 颜色即身份：每类固定色相，不用于表达涨跌 */
  return ({
    "us-iran":"#c5221f","oil":"#d97528","copper":"#b8761f","futures":"#1f5fbf",
    "zsxq":"#7b3fb5","zsxq-sum":"#0a9c5b","tech-geo":"#0e7c9c","cross":"#8a5cf6","macro-geo":"#546e7a"
  })[key] || "#68738a";
}
function tensionColor(v){
  if(v==null) return {bg:"#eef1f6", fg:"#68738a"};
  if(v>=90) return {bg:"#fdecea", fg:"#c5221f"};
  if(v>=70) return {bg:"#fff4e5", fg:"#d97528"};
  return {bg:"#e8f5ec", fg:"#0a9c5b"};
}

/* 取某门类的日报；KW 非空时在该门类内检索 */
function itemsOf(key){
  return allItems().filter(function(i){
    if(i.key !== key) return false;
    if(!KW) return true;
    var k = KW;
    return (i.title + " " + i.cat + " " + i.date + " " + (i.pageTitle||"") + " " + (i.summary||"")).toLowerCase().indexOf(k) >= 0;
  });
}

/* 门类的状态对象：今天是否已更新、最新一期是哪天、最新的更新时刻 */
function catStatus(key){
  var rows = allItems().filter(function(i){ return i.key === key; });
  if(!rows.length) return {count:0, today:false, latest:"", hhmm:"", rows:[]};
  var latest = rows[0].date;
  var today = todayStr();
  var hit = rows.filter(function(i){ return i.date === today; });
  /* 今日已更新：取今天所有日报里最晚的生成时刻 */
  var hhmm = "";
  if(hit.length){
    var maxM = "";
    hit.forEach(function(i){
      var m = i.mtime || "";
      if(m > maxM) maxM = m;
    });
    if(maxM.length >= 16) hhmm = maxM.slice(11,16);
  }
  return {count: rows.length, today: hit.length>0, latest: latest, hhmm: hhmm, rows: rows};
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ================= 渲染层 ================= */
function renderStats(){
  var items = allItems();
  var today = todayStr();
  var doneToday = 0;
  DATA.sources.forEach(function(s){ if(catStatus(s.key).today) doneToday++; });
  el("stats").innerHTML =
     '<div class="stat"><b>'+doneToday+' / '+DATA.sources.length+'</b><span>今日已更新门类</span></div>' +
     '<div class="stat"><b>'+items.length+'</b><span>收录日报</span></div>' +
     '<div class="stat"><b>'+DATA.sources.length+'</b><span>日报门类</span></div>' +
     '<div class="stat"><b>'+(items[0]?items[0].date:"—")+'</b><span>最新日期</span></div>';
}

/* 九宫格：每格一个门类，显示今日更新状态 + 更新时刻 / 最新一期 */
function renderGrid(){
  var h = '<div class="sec"><div class="sec-h"><h2>门类索引</h2>' +
          '<span>点格子进入该门类日报库</span></div><div class="grid">';
  DATA.sources.forEach(function(s){
    var st = catStatus(s.key);
    var c = catColor(s.key);
    var badge = st.today
      ? '<span class="st ok"><i></i>今日已更新'+(st.hhmm?' <span class="t">'+st.hhmm+'</span>':'')+'</span>'
      : '<span class="st no"><i></i>今日未更新</span>';
    var latestTxt = st.latest
      ? '最新一期 <b>'+st.latest.slice(5).replace("-","/")+'</b>'
      : '暂无';
    h += '<a class="cell" href="cat.html?k='+encodeURIComponent(s.key)+'" style="--tc:'+c+'">' +
           '<div class="cell-t"><span class="ic"></span>'+esc(s.cat)+'</div>' +
           badge +
           '<div class="cell-m">'+latestTxt+'<span class="sep">·</span>'+st.count+' 篇</div>' +
         '</a>';
  });
  h += '</div></div>';
  return h;
}

/* 今日已更新的日报简介卡片 */
function renderTodayCards(){
  var today = todayStr();
  var hits = allItems().filter(function(i){ return i.date === today; });
  var rows = hits.slice().sort(function(a,b){
    if(a.key !== b.key) return a.key < b.key ? -1 : 1;
    return (b.mtime||"") < (a.mtime||"") ? -1 : 1;
  });
  if(!rows.length){
    return '<div class="sec"><div class="sec-h"><h2>今日更新</h2><span>'+today+'</span></div>' +
      '<div class="empty" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r)">' +
      '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
      '<p>今天还没有日报更新</p>' +
      '<p class="sm">日报由定时任务自动生成，通常在早上 8:30 与晚上 20:30 前后上线</p></div></div>';
  }
  var h = '<div class="sec"><div class="sec-h"><h2>今日已更新</h2><span>'+today+' · 共 '+rows.length+' 篇</span></div>';
  rows.forEach(function(i){
    var c = catColor(i.key);
    var tens = (i.key==="us-iran" && i.tension!=null)
      ? ' <span class="tens" style="background:'+tensionColor(i.tension).bg+';color:'+tensionColor(i.tension).fg+'">紧张度 '+i.tension+'</span>' : "";
    var hhmm = (i.mtime||"").length>=16 ? i.mtime.slice(11,16) : "";
    h += '<a class="card" href="'+i.url+'" style="--tc:'+c+'">' +
           '<span class="card-bar"></span>' +
           '<span class="card-m">' +
             '<span class="card-t">'+esc(i.title)+tens+'</span>' +
             '<span class="card-s">'+esc(i.summary || "（无摘要）")+'</span>' +
             '<span class="card-f">' +
               '<span class="chip tc">'+esc(i.cat)+'</span>' +
               '<span class="chip">'+i.date+'</span>' +
               (hhmm?'<span class="chip">更新于 '+hhmm+'</span>':'') +
             '</span>' +
           '</span>' +
           '<span class="card-r"><b>'+(i.sizeKB||0)+' KB</b>' +
             '<span class="go">'+(hhmm?hhmm:'查看')+'</span></span>' +
         '</a>';
  });
  return h+'</div>';
}

function renderHome(){
  el("view").innerHTML = renderGrid() + renderTodayCards();
}

function renderError(msg){
  el("view").innerHTML =
    '<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>' +
    '<p>日报索引加载失败</p><p class="sm">'+(msg?("原因："+msg):"")+'　请检查网络后刷新页面</p></div>';
}

function el(id){ return document.getElementById(id); }

/* ================= 事件 ================= */
function initEvents(){
  var q = el("q"), clr = el("clr"), timer = null;
  q.oninput = function(){
    clr.classList.toggle("on", q.value.length>0);
    clearTimeout(timer);
    timer = setTimeout(function(){
      KW = q.value.trim().toLowerCase();
      /* 只在门类库视图内搜索才有意义 */
      if(ACTIVE) location.href = "cat.html?k="+encodeURIComponent(ACTIVE)+(KW?"&q="+encodeURIComponent(KW):"");
      else renderHome();
    }, 200);
  };
  clr.onclick = function(){ q.value=""; KW=""; clr.classList.remove("on"); renderHome(); q.focus(); };
}

function checkLocalEnv(){
  var h = location.hostname;
  var official = (h === "wanghahaniu.github.io") ||
                 (h.indexOf("localhost") >= 0 && location.port === "8899");
  if(!official) el("localWarn").classList.add("on");
}

function init(){
  initEvents();
  checkLocalEnv();
  loadManifest(function(){
    renderStats();
    renderHome();
    el("footInfo").textContent =
      "共 " + allItems().length + " 篇日报 · " + DATA.sources.length + " 个门类 · 覆盖 " +
      DATA.sources.map(function(s){return s.earliest;}).sort()[0] + " 至 " +
      (allItems()[0]?allItems()[0].date:"—");
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
